<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marlowe Bay — Open-World Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020;
    font-family: "Trebuchet MS", Verdana, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { position: absolute; background: rgba(8, 12, 26, 0.62); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(2px); }
  #stats { top: 12px; left: 12px; min-width: 210px; }
  #cash { font-size: 22px; font-weight: bold; color: #7dff9b; letter-spacing: 1px; }
  #healthbar { height: 10px; background: #222; border-radius: 5px; margin-top: 6px; overflow: hidden; }
  #healthfill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5a5a, #ffb347); }
  #healthtext { font-size: 12px; color: #ffd9d9; margin-top: 3px; }
  #wanted { top: 12px; right: 12px; font-size: 26px; letter-spacing: 4px; color: #ffd23e; text-shadow: 0 0 8px rgba(255, 210, 62, 0.7); }
  #wanted .off { color: rgba(255, 255, 255, 0.25); text-shadow: none; }
  #mission { top: 12px; left: 50%; transform: translateX(-50%); max-width: 46%; text-align: center; }
  #mission .m-title { font-size: 13px; color: #ffd23e; font-weight: bold; letter-spacing: 1px; }
  #mission .m-text { font-size: 15px; margin-top: 2px; }
  #minimap { position: absolute; left: 12px; bottom: 12px; border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px; background: rgba(8, 12, 26, 0.8); }
  #drive { right: 12px; bottom: 12px; text-align: right; min-width: 170px; }
  #speed { font-size: 30px; font-weight: bold; }
  #speed small { font-size: 13px; color: #ccc; }
  #weapon { font-size: 14px; color: #ffe9a8; margin-top: 2px; }
  #hint { right: 12px; bottom: 96px; font-size: 12px; color: #ddd; text-align: right; line-height: 1.5; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    display: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { left: 0; top: 8px; width: 18px; height: 2px; }
  #toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 26px; font-weight: bold;
    color: #ffd23e; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); text-align: center; display: none; }
  #screen { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(10, 16, 40, 0.88), rgba(60, 10, 40, 0.82)); pointer-events: auto; }
  #screen .card { max-width: 640px; padding: 28px 36px; text-align: center; }
  #screen h1 { margin: 0 0 4px; font-size: 52px; letter-spacing: 3px; color: #ffd23e;
    text-shadow: 0 0 24px rgba(255, 180, 40, 0.55); }
  #screen h2 { margin: 0 0 14px; font-size: 18px; font-weight: normal; color: #ffb347; letter-spacing: 2px; }
  #screen p { font-size: 15px; line-height: 1.6; color: #e8e8e8; }
  #screen .keys { font-size: 13px; color: #c9d4ff; line-height: 1.9; text-align: left; display: inline-block; }
  #screen button { margin-top: 18px; font-size: 20px; padding: 12px 34px; border: none; border-radius: 10px;
    background: #ffd23e; color: #231303; font-weight: bold; cursor: pointer; }
  #screen button:hover { background: #ffe27a; }
  #screen .small { font-size: 12px; color: #aaa; margin-top: 14px; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Marlowe Bay: an open-world crime game. Drive, steal cars, outrun the police and finish missions."></canvas>
<div id="hud">
  <div id="stats" class="panel">
    <div id="cash">$0</div>
    <div id="healthbar"><div id="healthfill"></div></div>
    <div id="healthtext">HEALTH 100</div>
  </div>
  <div id="wanted" class="panel"><span id="stars"></span></div>
  <div id="mission" class="panel"><div class="m-title" id="mission-title">FREE ROAM</div><div class="m-text" id="mission-text">Find Sal at the garage to start a job. Press M for missions.</div></div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="drive" class="panel"><div id="speed">0 <small>mph</small></div><div id="weapon">PISTOL — ∞</div></div>
  <div id="hint" class="panel">WASD move / drive &nbsp;·&nbsp; SHIFT run<br>MOUSE look &nbsp;·&nbsp; CLICK shoot<br>E enter / exit car &nbsp;·&nbsp; SPACE brake<br>M missions &nbsp;·&nbsp; P pause &nbsp;·&nbsp; H help</div>
  <div id="crosshair"></div>
  <div id="toast"></div>
</div>
<div id="screen"><div class="card" id="screen-card"></div></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
